name: NdiflyChat APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'ndiflychat.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NdiflyChat APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract NdiflyChat ZIP
        run: |
          test -f ndiflychat.zip || {
            echo "ERROR: ndiflychat.zip tidak ditemukan!"
            exit 1
          }
          mkdir -p source
          unzip -q ndiflychat.zip -d source

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          GRADLEW=$(find source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper tidak ditemukan."
            echo "Project harus memiliki project Android/Gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Node Dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

          if [ -f package.json ] && npm run | grep -q 'build'; then
            npm run build
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -d android ] && { [ -f capacitor.config.ts ] || [ -f capacitor.config.json ] || [ -f capacitor.config.js ]; }; then
            npx cap sync android
          fi

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: NdiflyChat-APK
          path: ${{ steps.project.outputs.dir }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          
