
name: NdiflyChat APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'ndiflychat.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NdiflyChat Android APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Node.js 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # 3. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses

      # 5. Extract ZIP
      - name: Extract NdiflyChat ZIP
        run: |
          if [ ! -f ndiflychat.zip ]; then
            echo "ERROR: ndiflychat.zip tidak ditemukan!"
            exit 1
          fi

          mkdir -p source
          unzip -q ndiflychat.zip -d source

      # 6. Find website index.html
      - name: Detect Website Files
        id: website
        run: |
          INDEX_FILE=$(find source -type f -iname "index.html" -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html tidak ditemukan!"
            exit 1
          fi

          WEB_ROOT=$(dirname "$INDEX_FILE")

          echo "Website ditemukan: $WEB_ROOT"
          echo "dir=$WEB_ROOT" >> "$GITHUB_OUTPUT"

      # 7. Create Capacitor Project
      - name: Create Capacitor Project
        run: |
          mkdir -p capacitor-project
          cd capacitor-project

          npm init -y

          npm install --save-exact \
            @capacitor/core@7 \
            @capacitor/android@7

          npm install --save-dev --save-exact \
            @capacitor/cli@7

      # 8. Copy Website
      - name: Copy Website Assets
        run: |
          mkdir -p capacitor-project/www

          cp -a "${{ steps.website.outputs.dir }}/." \
            capacitor-project/www/

      # 9. Configure Capacitor
      - name: Configure NdiflyChat
        working-directory: capacitor-project
        run: |
          npx cap init "NdiflyChat" "com.ndiflychat.app" --web-dir=www

      # 10. Generate Android Project
      - name: Generate Android Project
        working-directory: capacitor-project
        run: |
          npx cap add android

      # 11. Sync Android
      - name: Sync Android Project
        working-directory: capacitor-project
        run: |
          npx cap sync android

      # 12. Build APK
      - name: Build NdiflyChat APK
        working-directory: capacitor-project/android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 13. Upload APK
      - name: Upload NdiflyChat APK
        uses: actions/upload-artifact@v6
        with:
          name: NdiflyChat-APK
          path: capacitor-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
