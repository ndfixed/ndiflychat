name: Build NdiflyChat Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ndiflyChat.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract website from ZIP
        run: |
          set -e
          unzip -q ndiflyChat.zip -d extracted
          INDEX_FILE=$(find extracted -type f -name index.html -print -quit)
          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html tidak ditemukan di ZIP."
            exit 1
          fi
          WEB_ROOT=$(dirname "$INDEX_FILE")
          mkdir -p www
          cp -a "$WEB_ROOT"/. www/
          echo "Website root: $WEB_ROOT"
          ls -la www

      - name: Configure Capacitor
        run: |
          set -e
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli @capacitor/assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ndifly.chat",
            "appName": "NdiflyChat",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

          mkdir -p resources
          cp www/assets/icon-512.png resources/icon.png
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NdiflyChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
