
name: Build NdiflyChat APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Setup Node.js 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # 3. Verify Node.js
      - name: Verify Environment
        run: |
          echo "Node.js version:"
          node --version
          npm --version
          echo "Operating System:"
          cat /etc/os-release | head -n 3

      # 4. Setup Java
      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 6. Extract Website
      - name: Extract Website ZIP
        run: |
          mkdir -p web_files

          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Website ZIP not found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d web_files/

          INDEX_FILE=$(find web_files -name index.html -type f | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX_FILE")
          echo "Website directory: $WEB_DIR"

          mkdir -p build_apk/www

          cp -r "$WEB_DIR"/. build_apk/www/

      # 7. Install Cordova
      - name: Install Cordova
        run: |
          npm install -g cordova
          cordova --version

      # 8. Create Android Project
      - name: Create Cordova Project
        run: |
          cordova create build_apk \
            com.ndiflychat.app \
            NdiflyChat

      # 9. Configure Android
      - name: Configure Android Platform
        working-directory: build_apk
        run: |
          cordova platform add android

          echo "Installed platforms:"
          cordova platform ls

      # 10. Build APK
      - name: Build Debug APK
        working-directory: build_apk
        run: |
          cordova build android --debug

      # 11. Upload APK
      - name: Upload NdiflyChat APK
        uses: actions/upload-artifact@v7
        with:
          name: NdiflyChat-APK
          path: build_apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
