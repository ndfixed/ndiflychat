
name: Build NdiflyChat Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ndiflyChat.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract website from ZIP
        run: |
          set -e

          test -f ndiflyChat.zip || {
            echo "ERROR: ndiflyChat.zip tidak ditemukan"
            exit 1
          }

          unzip -q ndiflyChat.zip -d extracted

          INDEX_FILE=$(find extracted -type f -name index.html -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html tidak ditemukan"
            exit 1
          fi

          WEB_ROOT=$(dirname "$INDEX_FILE")

          mkdir -p www
          cp -a "$WEB_ROOT"/. www/

          echo "Website berhasil diekstrak"
          ls -la www

      - name: Configure Capacitor
        run: |
          set -e

          npm init -y

          npm install @capacitor/core@latest @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest @capacitor/assets@latest

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ndifly.chat",
            "appName": "NdiflyChat",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

          mkdir -p resources

          if [ -f www/assets/icon-512.png ]; then
            cp www/assets/icon-512.png resources/icon.png
          elif [ -f www/icon-512.png ]; then
            cp www/icon-512.png resources/icon.png
          else
            echo "Icon khusus tidak ditemukan, memakai icon default"
          fi

          npx cap add android

          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate --android
          fi

          npx cap sync android

      - name: Build Android APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/NdiflyChat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: NdiflyChat-Android-APK
          path: release/NdiflyChat.apk
          if-no-files-found: error
          retention-days: 30
          
