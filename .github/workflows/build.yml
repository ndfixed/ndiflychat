name: Build Web-to-APK with Permissions

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Unzip Website Files
        run: |
          mkdir -p web_files
          unzip -o ndiflychat.zip -d web_files/

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build APK via Cordova
        run: |
          npm install -g cordova
          cordova create build_apk com.ndiflychat.app ndiflychat
          cd build_apk
          cordova platform add android
          
          # Salin file web ke folder Cordova
          cp -r ../web_files/* www/
          
          # Tambahkan konfigurasi izin langsung ke AndroidManifest.xml
          cat << 'EOF' > platform_manifest_patch.js
