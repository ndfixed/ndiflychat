name: Build Web-to-APK with Permissions

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Unzip Website Files
        run: |
          mkdir -p web_files
          if [ -f ndiflyChat.zip ]; then
            unzip -o ndiflyChat.zip -d web_files/
          elif [ -f ndiflychat.zip ]; then
            unzip -o ndiflychat.zip -d web_files/
          else
            unzip -o *.zip -d web_files/
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3.0.0

      - name: Build APK via Cordova
        run: |
          npm install -g cordova
          cordova create build_apk com.ndiflychat.app ndiflychat
          cd build_apk
          cordova platform add android
          
          # Salin file web ke folder Cordova
          cp -r ../web_files/* www/
          
          # Inject izin Kamera, Mikrofon, dan Notifikasi ke AndroidManifest.xml
          cat << 'EOF' > platform_manifest_patch.js
          const fs = require('fs');
          const manifestPath = 'platforms/android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, 'utf8');
            const permissions = `
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            `;
            manifest = manifest.replace('</manifest>', `${permissions}</manifest>`);
            fs.writeFileSync(manifestPath, manifest);
          }
          EOF
          node platform_manifest_patch.js
          
          # Build APK versi Debug
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: ndiflychat-app
          path: build_apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
