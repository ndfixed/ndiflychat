name: Build Web-to-APK (Node 24)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Website ZIP
        run: |
          mkdir -p web_files
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP website tidak ditemukan!"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d web_files/

      - name: Build APK with Cordova
        run: |
          npm install -g cordova

          cordova create build_apk \
            com.ndiflychat.app \
            NdiflyChat

          cd build_apk

          cordova platform add android

          cp -r ../web_files/* www/

          # Build debug APK
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NdiflyChat-APK
          path: build_apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
